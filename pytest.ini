[pytest]
minversion = 7.0
testpaths = tests
pythonpath = .
python_files = test_*.py

# NOTE: --browser is intentionally NOT set here (pytest-playwright defaults to chromium and
# --browser is an "append" option, so setting it here would run extra browsers on every CLI override).
addopts =
    -ra
    --strict-markers
    --strict-config
    --screenshot=only-on-failure
    --video=retain-on-failure
    --tracing=retain-on-failure
    --output=reports/artifacts
    --html=reports/report.html
    --self-contained-html
    --reruns=1
    --reruns-delay=1

markers =
    smoke: critical-path checks, run on every commit (fast, <2 min)
    regression: full regression pack (superset of smoke)
    functional: verifies business behaviour / user-visible functionality
    ui: browser-driven UI tests (auto-applied to tests/ui)
    api: HTTP-level tests against Shopify storefront endpoints (auto-applied to tests/api)
    e2e: multi-step user journeys (auto-applied to tests/e2e)
    negative: invalid input / error-handling scenarios
    responsive: viewport / layout checks

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)-7s %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
