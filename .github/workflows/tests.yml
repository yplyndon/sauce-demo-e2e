name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 1 * * *"   # nightly regression
  workflow_dispatch:
    inputs:
      browsers:
        description: "Regression browsers (JSON array)"
        default: '["chromium"]'

# Never run two workflows against the shared demo store at the same time
concurrency:
  group: sauce-demo-store
  cancel-in-progress: false

env:
  PACING_SECONDS: "2"   # pause after each test so Shopify does not rate-limit shared CI IPs

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: pytest -m smoke          # sequential on purpose: no -n
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-report
          path: reports/

  regression:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1          # browsers run one after another, never together
      matrix:
        browser: ${{ fromJSON(github.event.inputs.browsers || '["chromium"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps ${{ matrix.browser }}
      - run: pytest -m regression --browser ${{ matrix.browser }}   # sequential: no -n
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-report-${{ matrix.browser }}
          path: reports/
